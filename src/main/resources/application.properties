spring.application.name=community-service
server.port=${SERVER_PORT:8083}

# Autoconfiguraciones excluidas: persistencia se compone explícitamente solo al activarla.
# RabbitMQ y el usuario generado siguen excluidos, sin cambios de seguridad.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# MongoDB requiere activación explícita, URI externa y base propia. Sin fallback local.
community.persistence.mongodb.enabled=${COMMUNITY_MONGODB_ENABLED:false}
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:foodly-community}
spring.data.mongodb.auto-index-creation=false

# Activación y contrato obligatoriamente explícitos: iam-current o issuer-audience.
# Sin selección/clave válidas, activar JWT falla; no se intenta otro contrato.
community.integrations.jwt.enabled=${COMMUNITY_JWT_ENABLED:false}
community.integrations.jwt.contract=${IAM_JWT_CONTRACT:}
community.integrations.jwt.algorithm=HS256
community.integrations.jwt.secret-base64=${IAM_SECRET_BASE64:}
community.integrations.jwt.issuer=${IAM_ISSUER:}
community.integrations.jwt.audience=${IAM_AUDIENCE:}

# No habilitar trazas de seguridad con headers, tokens o configuración sensible.
logging.level.org.springframework.security=INFO

# Consumidor Business opt-in; requiere MongoDB activado con replica set.
community.integrations.business-events.enabled=${COMMUNITY_BUSINESS_EVENTS_ENABLED:false}
community.integrations.business-events.max-attempts=${COMMUNITY_BUSINESS_MAX_ATTEMPTS:3}
community.integrations.business-events.retry-delay-ms=${COMMUNITY_BUSINESS_RETRY_DELAY_MS:250}
# La autoconfiguración genérica permanece excluida; la composición es propia.
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
